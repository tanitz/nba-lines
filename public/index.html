<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>NBA Line Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--APP-START-->
<header class="hero">
  <div class="hero-in">
    <div class="brand">
      <svg class="ball" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14.2" fill="#ff8a1f" stroke="#7a2e00" stroke-width="1.6"/>
        <path d="M16 2v28M2 16h28" stroke="#7a2e00" stroke-width="1.4" fill="none"/>
        <path d="M5.5 5.5c5 4.5 5 16.5 0 21M26.5 5.5c-5 4.5-5 16.5 0 21" stroke="#7a2e00" stroke-width="1.4" fill="none"/>
      </svg>
      <div>
        <h1>NBA Line Tracker</h1>
        <p class="sub">Pre-game spread, total and odds movement</p>
      </div>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
</header>

<div class="app">
  <p class="demo-note" id="demoNote" hidden>Demo mode: randomly generated sample data, not real odds.</p>

  <div class="poll-form" id="pollForm" hidden>
    <label for="tokenInput">Admin token (ADMIN_TOKEN)</label>
    <div class="poll-row">
      <input id="tokenInput" type="password" autocomplete="off">
      <button type="button" id="pollGo" class="btn">Fetch odds</button>
    </div>
    <p class="poll-msg" id="pollMsg"></p>
  </div>

  <nav class="filters" aria-label="Filters">
    <div class="seg" role="tablist" id="scopeTabs">
      <button type="button" role="tab" data-scope="upcoming" id="tabUpcoming">Upcoming</button>
      <button type="button" role="tab" data-scope="recent" id="tabRecent">Past games</button>
      <button type="button" role="tab" data-scope="teams" id="tabTeams">Teams</button>
    </div>
    <label class="field">
      <span>Bookmaker</span>
      <select id="bookSelect"></select>
    </label>
    <label class="field">
      <span>Odds format</span>
      <select id="fmtSelect">
        <option value="eu">Decimal</option>
        <option value="hk">Hong Kong</option>
        <option value="my">Malay</option>
        <option value="us">American</option>
      </select>
    </label>
  </nav>

  <main id="view"></main>

  <footer class="foot">
    Odds data from The Odds API. Times shown in your device's time zone.
  </footer>
</div>
<!--APP-END-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>

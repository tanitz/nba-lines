<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NBA Line Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--APP-START-->
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>ตามราคา NBA</h1>
      <p class="sub">แฮนดิแคปและสูง/ต่ำ ก่อนเริ่มแข่ง</p>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </header>

  <p class="demo-note" id="demoNote" hidden>ข้อมูลตัวอย่างแบบสุ่ม ไม่ใช่ราคาจริง ใส่คีย์ The Odds API เพื่อเริ่มเก็บราคาจริง</p>

  <div class="poll-form" id="pollForm" hidden>
    <label for="tokenInput">รหัสผู้ดูแล (ADMIN_TOKEN)</label>
    <div class="poll-row">
      <input id="tokenInput" type="password" autocomplete="off">
      <button type="button" id="pollGo" class="btn">ดึงราคา</button>
    </div>
    <p class="poll-msg" id="pollMsg"></p>
  </div>

  <nav class="filters" aria-label="ตัวกรอง">
    <div class="seg" role="tablist" id="scopeTabs">
      <button type="button" role="tab" data-scope="upcoming" id="tabUpcoming">ก่อนแข่ง</button>
      <button type="button" role="tab" data-scope="recent" id="tabRecent">แข่งแล้ว</button>
    </div>
    <label class="field">
      <span>เจ้ามือ</span>
      <select id="bookSelect"></select>
    </label>
    <label class="field">
      <span>ค่าน้ำ</span>
      <select id="fmtSelect">
        <option value="hk">ฮ่องกง</option>
        <option value="my">มาเลย์</option>
        <option value="eu">ยุโรป</option>
      </select>
    </label>
  </nav>

  <main id="view"></main>

  <footer class="foot">
    ข้อมูลราคาจาก The Odds API · เวลาแสดงตามเขตเวลาของเครื่องคุณ
  </footer>
</div>
<!--APP-END-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
